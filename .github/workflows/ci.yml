name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  epic-regression-and-build:
    name: Epic regression + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/heartlines
      BETTER_AUTH_SECRET: ci-only-heartlines-secret-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      POLSIA_EMAIL_PROXY_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Epic regression gate
        run: |
          npx vitest run \
            tests/unit/epic3-shell.test.ts \
            tests/unit/events/rsvp.contract.test.ts \
            tests/unit/business/discovery-candidates.test.ts \
            tests/unit/discover/contract.test.ts \
            tests/unit/feed/excludes-blocked-targets.test.ts \
            tests/unit/epic1-safety-rules.test.ts

      - name: Build production app
        run: npm run build
